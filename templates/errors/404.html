{% extends "base/base.html" %}

{% block title %}404 Not Found — {{ PLATFORM_NAME }}{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding-top: var(--space-16); padding-bottom: var(--space-16);">
  <div style="font-size: var(--font-size-4xl); font-weight: var(--font-weight-bold); color: var(--color-accent); margin-bottom: var(--space-2);">404</div>
  <h1 style="font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); margin-bottom: var(--space-3);">Page Not Found</h1>
  <p style="font-size: var(--font-size-base); color: var(--text-secondary); max-width: 480px; margin: 0 auto var(--space-6) auto;">
    The requested resource could not be located on the EPS Phoenix server. Verify the URL or return to the platform home.
  </p>
  <a href="{% url 'core:index' %}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
