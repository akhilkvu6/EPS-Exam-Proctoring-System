{% extends "base/base.html" %}

{% block title %}403 Forbidden — {{ PLATFORM_NAME }}{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding-top: var(--space-16); padding-bottom: var(--space-16);">
  <div style="font-size: var(--font-size-4xl); font-weight: var(--font-weight-bold); color: var(--color-danger); margin-bottom: var(--space-2);">403</div>
  <h1 style="font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); margin-bottom: var(--space-3);">Access Denied</h1>
  <p style="font-size: var(--font-size-base); color: var(--text-secondary); max-width: 480px; margin: 0 auto var(--space-6) auto;">
    You do not possess the required institutional permissions to access this workspace or endpoint.
  </p>
  <a href="{% url 'core:index' %}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
