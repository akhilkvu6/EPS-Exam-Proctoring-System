<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
</head>
<body>

<h1>Student Login</h1>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Login</button>
</form>

<p>
    Don't have a student account?
    <a href="{% url 'student_register' %}">
        Register here
    </a>
</p>

</body>
</html>
