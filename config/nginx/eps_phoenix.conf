# EPS Phoenix Production Nginx Reverse Proxy Configuration
# Compliant with Section 3.4 & Section 21 (Production Deployment & Reverse Proxy Routing)

upstream eps_phoenix_upstream {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name exam.institution.edu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Authoritative TLS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name exam.institution.edu;

    # SSL Certificates (Institutional or Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/exam.institution.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exam.institution.edu/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; media-src 'none'; object-src 'none';" always;

    # Request Body Size (Permit student documents & question diagram uploads)
    client_max_body_size 15M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static Files Routing (WhiteNoise / Static Root)
    location /static/ {
        alias /var/www/eps_phoenix/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Media Uploads Routing
    location /media/ {
        alias /var/www/eps_phoenix/media/;
        expires 7d;
        add_header Cache-Control "private, no-transform";
    }

    # Application WSGI Routing to Gunicorn
    location / {
        proxy_pass http://eps_phoenix_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # WebSockets / Realtime upgrade readiness
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
